name: Publish Release to GCP Artifact Registry

on:
  pull_request:
    types:
      - closed
    # Matches release branches like 3.2.x, 4.0.x, etc.
    branches:
      - '[0-9].[0-9].x'
      - '[0-9].[0-9][0-9].x'
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to fetch all tags for version collision detection

      - name: Compute release version
        id: version
        run: |
          PROJECT_VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sed 's/-SNAPSHOT//')
          DATE=$(date +%Y.%m.%d)
          BASE_VERSION="${PROJECT_VERSION}-ppsk-${DATE}"

          # Find the next available version by checking existing git tags.
          # If v4.0.0-ppsk-2026.03.17 is taken, try v4.0.0-ppsk-2026.03.17-1, etc.
          VERSION="${BASE_VERSION}"
          COUNTER=0
          while git tag -l "v${VERSION}" | grep -q .; do
            COUNTER=$((COUNTER + 1))
            VERSION="${BASE_VERSION}-${COUNTER}"
          done

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set version in pom.xml
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      - name: Deploy release to GCP Artifact Registry
        run: |
          mvn deploy \
            -Pgcloud \
            -DskipTests \
            -DskipITs \
            -Dhttp.keepAlive=false \
            -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

      - name: Create and push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
