name: Publish Snapshot to GCP Artifact Registry

on:
  pull_request:
    types:
      - closed
    branches:
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute snapshot version
        id: version
        run: |
          PROJECT_VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | sed 's/-SNAPSHOT//')
          DATE=$(date +%Y.%m.%d)
          VERSION="${PROJECT_VERSION}-ppsk-${DATE}-SNAPSHOT"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set version in pom.xml
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      - name: Deploy snapshot to GCP Artifact Registry
        run: |
          mvn deploy \
            -Pgcloud \
            -DskipTests \
            -DskipITs \
            -Dmaven.javadoc.skip=true \
            -Dhttp.keepAlive=false \
            -Dmaven.wagon.http.pool=false \
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
